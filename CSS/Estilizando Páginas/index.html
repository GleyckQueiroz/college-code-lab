<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estilizando Página</title>
  
  <style>

    #container{
      text-align: center;
      padding: 10px;
      border-style: dotted;
      border-color: black;
      background-color: gray;
      width: 960px;
      margin: auto;
    }

    #container h1{
      color: #0f03ff;
    }
    #container li{
      list-style: none;
      margin-bottom: 8px;
    }

    .text-container{
      font-weight: bold;
    }
  
  </style>
</head>
<body>
  
  <div id="container">
    <h1>Titulo Principal</h1>
    <p class="text-container">Lorem, ipsum dolor sit amet consectetur adipisicing elit. Aspernatur nihil aperiam neque, praesentium harum tenetur modi et vitae distinctio delectus dolores eaque? Vel maiores tempore eaque laboriosam id. Nulla, sapiente.</p>

    <ul>
      <li>Item 1</li>
      <li>Item 2</li>
      <li>Item 3</li>
      <li>Item 4</li>
    </ul>
  </div>

</body>
</html>
